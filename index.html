<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0f1420" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>行测错题诊断 v4</title>
<style>
/* ============================================================
   行测错题诊断 · 设计系统（内嵌）
   ============================================================ */
:root {
  --bg: #0f1420; --bg-soft: #161d2e; --panel: #1c2538; --panel-2: #232e45;
  --border: #2c3956; --text: #e8edf7; --text-dim: #9aa7c2; --text-mute: #6b7795;
  --primary: #4f9cf9; --primary-soft: rgba(79,156,249,0.14); --accent: #ffb547;
  --danger: #ff6b6b; --success: #4fd1a5; --warn: #f5a623;
  --m-speech: #5b8def; --m-judge: #b06bff; --m-data: #2ec1a0; --m-quant: #ff8a5b; --m-common: #f6c347;
  --radius: 14px; --radius-sm: 9px; --shadow: 0 10px 30px rgba(0,0,0,0.35); --maxw: 1080px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.6}
#app{min-height:100vh;display:flex;flex-direction:column}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--text);background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
textarea{resize:vertical;min-height:120px;line-height:1.6}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;padding:14px 24px;background:rgba(22,29,46,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:.5px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--accent));display:grid;place-items:center;font-size:16px;color:#0f1420;font-weight:800}
.topbar .nav{display:flex;gap:4px;margin-left:8px}
.topbar .nav a{padding:8px 14px;border-radius:8px;color:var(--text-dim);font-size:14px;font-weight:500}
.topbar .nav a.active{background:var(--primary-soft);color:var(--primary)}
.topbar .nav a:hover{text-decoration:none;color:var(--text)}
.topbar .spacer{flex:1}
.topbar .stat-mini{color:var(--text-dim);font-size:13px}
.main{flex:1;padding:28px 24px 100px;max-width:var(--maxw);margin:0 auto;width:100%}
.page-head{margin-bottom:22px}
.page-head h1{font-size:24px;letter-spacing:.3px}
.page-head p{color:var(--text-dim);margin-top:6px;font-size:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card+.card{margin-top:16px}
.card-title{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-title .dot{width:8px;height:8px;border-radius:50%;background:var(--primary)}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media (max-width:880px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;background:var(--panel-2);color:var(--text);border:1px solid var(--border);transition:transform .08s,background .15s,border-color .15s}
.btn:hover{background:var(--border)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:#3d8be0}
.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn-danger:hover{background:rgba(255,107,107,.12)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-dim)}
.btn-ghost:hover{background:var(--bg-soft);color:var(--text)}
.btn-sm{padding:5px 10px;font-size:12px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid transparent}
.tag-speech{background:rgba(91,141,239,.14);color:var(--m-speech);border-color:rgba(91,141,239,.35)}
.tag-judge{background:rgba(176,107,255,.14);color:var(--m-judge);border-color:rgba(176,107,255,.35)}
.tag-data{background:rgba(46,193,160,.14);color:var(--m-data);border-color:rgba(46,193,160,.35)}
.tag-quant{background:rgba(255,138,91,.14);color:var(--m-quant);border-color:rgba(255,138,91,.35)}
.tag-common{background:rgba(246,195,71,.14);color:var(--m-common);border-color:rgba(246,195,71,.35)}
.tag-muted{background:var(--bg-soft);color:var(--text-dim);border-color:var(--border)}
.form-row{margin-bottom:16px}
.form-row>label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:6px;font-weight:500}
.form-row .hint{font-size:12px;color:var(--text-mute);margin-top:5px}
.dropzone{border:2px dashed var(--border);border-radius:var(--radius);padding:24px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;color:var(--text-dim);display:block}
.dropzone:hover,.dropzone.drag{border-color:var(--primary);background:var(--primary-soft);color:var(--text)}
.dropzone .dz-icon{font-size:28px;margin-bottom:8px}
.dropzone input{display:none}
.preview-img{max-width:100%;max-height:320px;border-radius:var(--radius-sm);border:1px solid var(--border);margin-top:10px}
.img-wrap{position:relative;display:inline-block;margin-top:10px}
.img-wrap .rm{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.7);color:#fff;border-radius:50%;width:22px;height:22px;font-size:14px;display:grid;place-items:center}
.analysis-box{background:var(--bg-soft);border:1px dashed var(--primary);border-radius:var(--radius);padding:16px 18px;margin-top:14px}
.analysis-box .ab-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.analysis-box .ab-label{color:var(--text-dim);font-size:13px;min-width:64px}
.analysis-box .confidence{font-size:12px;color:var(--text-mute)}
.analysis-box .reasoning{color:var(--text-dim);font-size:13px;margin-top:6px}
.pit-list{margin-top:10px;display:grid;gap:6px}
.pit-item{display:flex;gap:8px;font-size:13px;color:var(--text-dim);background:rgba(255,181,71,.07);border-left:3px solid var(--accent);padding:8px 10px;border-radius:0 6px 6px 0}
.pit-item b{color:var(--accent)}
.q-list{display:grid;gap:12px}
.q-item{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start}
@media (max-width:680px){.q-item{grid-template-columns:1fr}}
.q-item .q-thumb{width:70px;height:70px;border-radius:8px;background:var(--bg-soft);border:1px solid var(--border);display:grid;place-items:center;color:var(--text-mute);font-size:11px;overflow:hidden}
.q-item .q-thumb img{width:100%;height:100%;object-fit:cover}
.q-item .q-body .q-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.q-item .q-body .q-text{color:var(--text);font-size:14px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.q-item .q-body .q-note{margin-top:8px;font-size:12px;color:var(--text-mute);font-style:italic}
.q-item .q-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.q-item .q-time{font-size:11px;color:var(--text-mute)}
.empty{text-align:center;padding:60px 20px;color:var(--text-mute)}
.empty .em-icon{font-size:42px;margin-bottom:10px;opacity:.6}
.empty h3{color:var(--text-dim);margin-bottom:6px;font-size:16px}
.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
@media (max-width:880px){.stat-cards{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
.stat-card .sc-label{font-size:12px;color:var(--text-mute)}
.stat-card .sc-value{font-size:28px;font-weight:700;margin-top:4px;letter-spacing:.5px}
.stat-card .sc-sub{font-size:12px;color:var(--text-dim);margin-top:2px}
.bar-row{display:grid;grid-template-columns:90px 1fr 60px;gap:12px;align-items:center;margin-bottom:12px}
.bar-row .bl-name{font-size:13px;color:var(--text)}
.bar-track{height:22px;background:var(--bg-soft);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;transition:width .5s ease}
.bar-row .bl-val{font-size:13px;color:var(--text-dim);text-align:right;font-variant-numeric:tabular-nums}
.pit-rank-item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--border)}
.pit-rank-item:last-child{border-bottom:none}
.pit-rank-num{width:26px;height:26px;border-radius:50%;background:var(--bg-soft);color:var(--text-dim);display:grid;place-items:center;font-size:13px;font-weight:700;flex-shrink:0}
.pit-rank-item.top1 .pit-rank-num{background:var(--accent);color:#0f1420}
.pit-rank-item.top2 .pit-rank-num{background:#c0c8da;color:#0f1420}
.pit-rank-item.top3 .pit-rank-num{background:#c98b5a;color:#0f1420}
.pit-rank-body .prb-head{display:flex;gap:8px;align-items:center;margin-bottom:4px;flex-wrap:wrap}
.pit-rank-body .prb-count{font-size:12px;color:var(--text-mute)}
.pit-rank-body .prb-pit{font-size:13px;color:var(--text-dim)}
.trend-chart{display:flex;align-items:flex-end;gap:4px;height:140px;padding-top:10px}
.trend-bar{flex:1;background:linear-gradient(180deg,var(--primary),rgba(79,156,249,.3));border-radius:4px 4px 0 0;min-height:4px;position:relative;transition:height .4s ease}
.trend-bar:hover{background:linear-gradient(180deg,var(--accent),rgba(255,181,71,.3))}
.trend-bar .tb-tip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:11px;color:var(--text-dim);margin-bottom:4px;white-space:nowrap}
.trend-x{display:flex;gap:4px;margin-top:8px}
.trend-x span{flex:1;text-align:center;font-size:11px;color:var(--text-mute)}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;background:rgba(22,29,46,.95);backdrop-filter:blur(10px);border-top:1px solid var(--border);max-width:var(--maxw);margin:0 auto}
.tabbar a{flex:1;padding:12px 0;text-align:center;color:var(--text-mute);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar a .tb-ico{font-size:18px}
.tabbar a.active{color:var(--primary)}
.tabbar a:hover{text-decoration:none;color:var(--text)}
@media (min-width:880px){.tabbar{display:none}}
@media (max-width:880px){.topbar .nav{display:none}.main{padding-bottom:80px}}
.toast-container{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel-2);border:1px solid var(--border);border-left:4px solid var(--primary);padding:12px 16px;border-radius:8px;min-width:220px;box-shadow:var(--shadow);font-size:13px;animation:toastIn .25s ease}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warn)}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.modal-overlay{position:fixed;inset:0;z-index:150;background:rgba(8,12,20,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .15s ease}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:640px;max-height:86vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel)}
.modal-head h3{font-size:16px}
.modal-body{padding:20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:var(--panel)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-body .detail-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.modal-body .detail-img{max-width:100%;border-radius:8px;border:1px solid var(--border);margin-bottom:12px}
.modal-body .detail-text{background:var(--bg-soft);padding:14px;border-radius:8px;font-size:14px;line-height:1.7;white-space:pre-wrap;margin-bottom:12px}
.modal-body .section-label{font-size:12px;color:var(--text-mute);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.5px}
.muted{color:var(--text-mute)}
.row-gap{display:flex;gap:8px;flex-wrap:wrap}
.mt-12{margin-top:12px}
.mb-12{margin-bottom:12px}
.text-center{text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-container" class="toast-container"></div>
<div id="modal-root"></div>

<script>
/* ============================================================
 * data.js — 行测错题诊断知识库
 * ============================================================ */
const MODULES = {
  speech: { key:"speech", name:"言语理解", short:"言语", color:"var(--m-speech)", icon:"📖" },
  judge:  { key:"judge",  name:"判断推理", short:"判断", color:"var(--m-judge)",  icon:"🧩" },
  data:   { key:"data",   name:"资料分析", short:"资料", color:"var(--m-data)",   icon:"📊" },
  quant:  { key:"quant",  name:"数量关系", short:"数量", color:"var(--m-quant)",  icon:"🔢" },
  common: { key:"common", name:"常识判断", short:"常识", color:"var(--m-common)", icon:"🌍" },
};

const SUBTYPES = [
  { type:"logic_fill", module:"speech", name:"逻辑填空",
    logic:"结合语境与逻辑关系（转折、递进、并列、因果）判断空缺处词义，需辨析近义词的侧重点与搭配习惯。",
    pits:["只看选项词义相近就盲选，忽略上下文逻辑关系（尤其转折后才是重点）","未辨析近义词的语意轻重 / 感情色彩 / 搭配对象差异","第二个空被第一个空带偏，应整体代入验证"] },
  { type:"fragment_read", module:"speech", name:"片段阅读",
    logic:"找主旨句，关注关联词（但、因此、可见、也就是说）后的总结性表述；区分主旨与细节。",
    pits:["把举例 / 列数据当主旨，主旨往往是举例后的结论","选了表述片面或过度引申的选项，主旨应概括全面","主观臆断，选项内容脱离原文凭常识选"] },
  { type:"sentence_order", module:"speech", name:"语句排序 / 衔接",
    logic:"通过指代词、关联词、时间顺序、话题一致性确定首句与邻接关系，再验证整体脉络。",
    pits:["凭语感通读排序，未抓指代词（这、其、该）与关联词（然而、因此）的逻辑钩子","首句判断错，导致后续连锁错误"] },

  { type:"graphic", module:"judge", name:"图形推理",
    logic:"观察数量规律（点、线、面、素、角、点线一笔画）与位置规律（平移、旋转、翻转、对称）。",
    pits:["死盯一种规律（如只数线条），忽略面的数量 / 对称性 / 一笔画（奇点数）","位置类题目未分组观察（如奇偶项规律不同）","立体图形忽略公共面、相对面、相邻面关系"] },
  { type:"definition", module:"judge", name:"定义判断",
    logic:"提取定义要件（主体、客体、条件、方式、目的、结果），逐要件与选项比对，要件不符即排除。",
    pits:["未拆解要件，凭感觉整体匹配","选项符合部分要件就选，遗漏关键否定要件（如'不包含''仅限'）","混淆'符合定义'与'属于该类对象'，主体错位"] },
  { type:"analogy", module:"judge", name:"类比推理",
    logic:"判断词项间关系（全同、包含、交叉、并列、属性、功能、对应），再结合二级辨析（方向、程度、范畴）。",
    pits:["只看一级关系（都是并列），忽略二级辨析（自然 vs 人造、必然 vs 或然）","关系方向反了（如'包含'与'被包含'）","题干是必然关系，选项却选了或然关系"] },
  { type:"logic_judge", module:"judge", name:"逻辑判断（削弱加强/朴素逻辑）",
    logic:"找论证结构（论点-论据-论证），削弱优先否论据、断桥、他因、否论点；加强优先搭桥、补充论据。",
    pits:["把'削弱论据'当最强削弱，实际'断桥（切断论据与论点联系）'力度更强","可能性推理选了'无关项'或'诉诸权威'选项","朴素逻辑未充分利用确定信息（如'每个人都说了一半真话'这类约束）"] },

  { type:"data_growth", module:"data", name:"增长 / 增长率",
    logic:"区分增长量（绝对值）与增长率（相对值），熟记公式：增长率=（现期-基期）/基期；年均增长率用开方修正。",
    pits:["增长量与增长率混淆，看错问的是'增长多少'还是'增长百分之几'","把'同比'（与上年同期）当'环比'（与上一期）","计算年均增长率时漏开 n 次方或 n 取错期数"] },
  { type:"data_ratio", module:"data", name:"比重 / 倍数 / 平均数",
    logic:"现期比重=部分/整体；比重变化需用部分增长率与整体增长率比较判断升降。",
    pits:["比重与比重变化量混淆：后者需用 (部分率-整体率)/(1+部分率)×现期比重 计算","平均数（如人均产量）把'总数/总人数'的分子分母写反","倍数题把'A是B几倍'（A/B）算成'A比B多几倍'（A/B-1）"] },
  { type:"data_comprehensive", module:"data", name:"综合分析（说法判断）",
    logic:"逐项验证四个说法的正确性，优先验证带'约、最、均、首'等绝对表述或易定位数据的说法。",
    pits:["四个说法逐字硬算耗时，应优先验证易排除项（数据明显不符 / 表述绝对化）","把'正确的是'与'错误的是'看反","材料单位（万、亿、%）换算出错"] },

  { type:"math_op", module:"quant", name:"数学运算",
    logic:"优先代入排除、特值、方程、比例法；行程、工程、利润、排列组合、概率分类套用模型。",
    pits:["硬算不优先用代入排除 / 特值法，耗时且易错","行程问题未分清'相遇/追及'，或漏算往返时间","排列组合混淆'有序排列A'与'无序组合C'，或重复/遗漏","概率题漏乘或错把'至少一个'用对立事件简化"] },
  { type:"number_seq", module:"quant", name:"数字推理",
    logic:"观察作差、作商、作和、分组（交叉、两两分组）、递推（倍数±常数、平方/立方修正）。",
    pits:["只作一次差，未作二次差或多级差","未尝试交叉数列（奇数项与偶数项分别成规律）","忽略分数 / 小数数列与多次方数列（如 2,3,10 取近幂修正）"] },

  { type:"common_politics", module:"common", name:"政治 / 时政",
    logic:"识记最新重大会议、政策表述、根本/基本制度的准确表述，注意'最''根本''基本'等限定。",

const Analyzer = (() => {
  const { MODULES, SUBTYPES, SUBTYPE_MAP, RULES, MODULE_FALLBACK } = window.XC;

  function matchRule(text, rule) {
    const hits = [];
    for (const kw of rule.keywords) if (text.indexOf(kw) !== -1) hits.push(kw);
    return { hits: hits.length, words: hits };
  }

  function analyze(rawText) {
    const text = (rawText || "").replace(/\s+/g, " ").trim();
    if (!text) return { module:null, moduleScore:0, subtype:null, subtypeScore:0, confidence:0, reasoning:"未输入题目内容，无法分析。", matched:[], pits:[], logic:null, unknown:true };

    const typeScores = {}, moduleScores = {}, matchedWords = {}, matchedReasons = {};
    for (const rule of RULES) {
      const { hits, words } = matchRule(text, rule);
      if (hits > 0) {
        typeScores[rule.type] = (typeScores[rule.type]||0) + hits;
        moduleScores[rule.module] = (moduleScores[rule.module]||0) + hits;
        if (!matchedWords[rule.type]) matchedWords[rule.type] = [];
        matchedWords[rule.type].push(...words);
        matchedReasons[rule.type] = rule.reason;
      }
    }

    let bestType = null, bestTypeScore = 0;
    for (const t in typeScores) if (typeScores[t] > bestTypeScore) { bestTypeScore = typeScores[t]; bestType = t; }

    let bestModule = null, bestModuleScore = 0;
    for (const m in moduleScores) if (moduleScores[m] > bestModuleScore) { bestModuleScore = moduleScores[m]; bestModule = m; }

    let usedFallback = false;
    if (!bestModule) {
      for (const m in MODULE_FALLBACK) {
        for (const kw of MODULE_FALLBACK[m]) {
          if (text.indexOf(kw) !== -1) {
            moduleScores[m] = (moduleScores[m]||0) + 1;
            if (!bestModule || moduleScores[m] > bestModuleScore) { bestModule = m; bestModuleScore = moduleScores[m]; }
            usedFallback = true;
          }
        }
      }
    }

    if (!bestModule) return { module:null, moduleScore:0, subtype:null, subtypeScore:0, confidence:0, reasoning:"未匹配到明显的行测题型特征词，请手动选择模块与题型。", matched:[], pits:[], logic:null, unknown:true };

    let confidence = Math.min(95, 35 + bestModuleScore * 18);
    if (usedFallback) confidence = Math.min(confidence, 45);
    if (!bestType) confidence = Math.min(confidence, 55);

    let pits = [], logic = null, subtypeKey = null, subtypeScore = 0, reasoning = "";
    if (bestType) {
      const st = SUBTYPE_MAP[bestType];
      subtypeKey = bestType; subtypeScore = bestTypeScore;
      pits = st.pits; logic = st.logic;
      reasoning = `命中题型【${st.name}】（${MODULES[st.module].name}）。${matchedReasons[bestType]}。共匹配 ${bestTypeScore} 个特征词：${[...new Set(matchedWords[bestType])].join("、")}。`;
    } else {
      reasoning = `判断为【${MODULES[bestModule].name}】模块，但未能精确到具体题型。命中的模块特征词较少，建议手动选择题型以获得对应踩坑提示。`;
    }

    const matched = [];
    for (const t in matchedWords) {
      const st = SUBTYPE_MAP[t];
      matched.push({ module:st.module, type:t, typeName:st.name, words:[...new Set(matchedWords[t])], score:typeScores[t] });
    }
    matched.sort((a,b)=>b.score-a.score);

    return { module:bestModule, moduleScore:bestModuleScore, subtype:subtypeKey, subtypeScore, confidence:Math.round(confidence), reasoning, matched, pits, logic, unknown:false };
  }

  function getPreset(moduleKey, subtypeKey) {
    if (subtypeKey && SUBTYPE_MAP[subtypeKey]) return { pits: SUBTYPE_MAP[subtypeKey].pits, logic: SUBTYPE_MAP[subtypeKey].logic };
    if (moduleKey) {
      const list = SUBTYPES.filter(s => s.module === moduleKey);
      return { pits: list.flatMap(s => s.pits), logic: list.map(s => s.name + "：" + s.logic).join("\n") };
    }
    return { pits: [], logic: "" };
  }

  /* ========== AI 自动拆解引擎 ========== */
  function extractOptions(text) {
    const opts = {};
    const letters = ["A","B","C","D","E","F"];
    // 多种选项分隔符：A. A、A) A A: A. A、 A. A) 等
    const delim = "[.、)\\s:：．、)]+";
    for (let i = 0; i < letters.length; i++) {
      const L = letters[i];
      // 当前选项起始位置
      const startRe = new RegExp(`(?:^|\\s)${L}${delim}`, "i");
      const m = startRe.exec(text);
      if (!m) continue;
      const startIdx = m.index + m[0].length;
      // 找下一个选项字母的起始位置作为结束
      let endIdx = text.length;
      for (let j = i + 1; j < letters.length; j++) {
        const nextRe = new RegExp(`(?:^|\\s)${letters[j]}${delim}`, "i");
        const nm = nextRe.exec(text.slice(startIdx));
        if (nm && nm.index < endIdx - startIdx) {
          endIdx = startIdx + nm.index;
        }
      }
      let content = text.slice(startIdx, endIdx).trim().replace(/[,，;；]$/, "").slice(0, 100);
      if (content.length < 1) continue;
      opts[L] = content;
    }
    return opts;
  }
  function parseCorrectLetter(ans) {

  }
  const MODULE_TIPS = {

  function detectLogicRelation(t) {
    if (/但|然而|却|不过|可是/.test(t)) return "转折";

    if (/因为|由于|所以|因此|导致/.test(t)) return "因果";

  function detectMainPoint(t) {

      reason += `📌 公式匹配：${detectDataFormula(text)}。\n`;
      reason += `📌 计算验证：根据材料数据代入公式计算，结果与${correctLetter}项吻合。\n`;
      reason += `📌 易错提醒：注意区分同比vs环比、单位换算、比重变化量vs变化率。`;
      return reason;
    }
    if (analysis.module === "quant") {
      let reason = `✅ **正确选项 ${correctLetter}**（${correctContent}）的核心逻辑：\n`;
      reason += `📌 题型识别：${detectQuantModel(text)}。\n`;
      reason += `📌 解法选择：优先考虑代入排除/特值法/比例法，计算验证后${correctLetter}项满足题意。`;
      return reason;
    }
    // 常识判断或其他
    let reason = `✅ **正确选项 ${correctLetter}**（${correctContent}）的核心逻辑：\n`;
    reason += `📌 考点定位：本题考查${analysis.subtype?SUBTYPE_MAP[analysis.subtype].name:mod.name}相关知识点。\n`;
    reason += `📌 排除法：绝对化表述（都/一定/只有）多为错项，${correctLetter}项表述严谨、符合考点要求。`;
    return reason;
  }

  function whyWrongOptions(text, analysis, correctLetter, options) {
    if (!options[correctLetter]) {
      return "（📌 选项格式不标准，AI 无法自动提取所有选项内容。请确认题目中 A/B/C/D 选项格式规范，或手动查看你的正解/错题笔记）";
    }
    const wrongLetters = Object.keys(options).filter(L => L !== correctLetter);
    const trapKind = (L, content) => guessTrapKind(L, content, text, analysis);
    let out = "❌ **错误选项陷阱拆解**：\n";
    wrongLetters.forEach(L => {
      out += `• **${L}项**「${options[L]}」— ${trapKind(L, options[L])}\n`;
    });
    return out;
  }

  function generateExplanation(rawText, myAnswer, correctAnswer) {
    const text = (rawText||"").replace(/\s+/g," ").trim();
    if (!text) return null;
    const analysis = Analyzer.analyze(text);
    if (analysis.unknown || !analysis.module) return null;
    const mod = MODULES[analysis.module];
    const sub = analysis.subtype ? SUBTYPE_MAP[analysis.subtype] : null;
    const tips = MODULE_TIPS[analysis.module] || MODULE_TIPS.speech;
    const options = extractOptions(text);
    const correctLetter = parseCorrectLetter(correctAnswer);
    const wrongLetter = parseCorrectLetter(myAnswer);

    let correctReason = "";
    if (correctLetter) {
      correctReason = whyCorrect(text, analysis, correctLetter, options);
    } else {
      correctReason = "（📌 请在「正确答案」处填写字母 A/B/C/D，AI 才能给出正确选项的深度分析）";
    }

    let wrongReason = "";
    if (correctLetter) {
      wrongReason = whyWrongOptions(text, analysis, correctLetter, options);
    } else {
      wrongReason = "（📌 请先填写正确答案，AI 才能对比拆解每个错误选项的陷阱）";
    }

    let skillReason = `💡 **这道题的解题技巧**：\n`;
    if (sub) skillReason += `📍 这是【${sub.name}】，核心方法：${sub.logic}\n`;
    skillReason += `📋 通用策略：${tips.strategy}\n`;
    skillReason += `⚡ 快速捷径：${tips.shortcut}\n`;
    skillReason += `⚠️ 易踩坑：${tips.traps.slice(0,3).join("、")}`;

    return {
      module: analysis.module, subtype: analysis.subtype,
      correctLetter, wrongLetter,
      correctReason, wrongReason, skillReason,
      options,
      generatedAt: Date.now(), version: "3.0"
    };
  }

  return { analyze, getPreset, generateExplanation, extractOptions };
})();
window.XC.Analyzer = Analyzer;

/* ============================================================
 * store.js

const Store = (() => {
  const KEY = "xc_records_v1";
  function load() { try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : []; } catch(e){ console.warn("load fail",e); return []; } }
  function save(arr) { try { localStorage.setItem(KEY, JSON.stringify(arr)); } catch(e){ console.error("save fail",e); throw new Error("存储失败：可能截图过大超过浏览器本地配额，请裁剪后再上传。"); } }
  function uid() { return "q" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

  function getAll() { return load().sort((a,b)=>b.createdAt-a.createdAt); }
  function getById(id) { return load().find(r=>r.id===id) || null; }
  function add(record) {
    const arr = load();
    const item = Object.assign({ id:uid(), createdAt:Date.now(), text:"", image:null, module:null, subtype:null, analysis:null, pits:[], myAnswer:"", correctAnswer:"", aiAnalysis:null, note:"", tags:[] }, record);
    arr.push(item); save(arr); return item;
  }
  function update(id, patch) {
    const arr = load(); const idx = arr.findIndex(r=>r.id===id);
    if (idx === -1) return null;
    arr[idx] = Object.assign({}, arr[idx], patch, { id, createdAt: arr[idx].createdAt });
    save(arr); return arr[idx];
  }
  function remove(id) { const arr = load(); const next = arr.filter(r=>r.id!==id); save(next); return arr.length !== next.length; }
  function clearAll() { save([]); }

  function stats() {
    const arr = load(); const total = arr.length;
    const moduleCounts = {}; for (const m in window.XC.MODULES) moduleCounts[m]=0;
    arr.forEach(r=>{ if (r.module) moduleCounts[r.module] = (moduleCounts[r.module]||0)+1; });
    const subtypeCounts = {};
    arr.forEach(r=>{ if (r.subtype) subtypeCounts[r.subtype] = (subtypeCounts[r.subtype]||0)+1; });
    const pitMap = {};
    arr.forEach(r=>{
      if (!r.pits || !r.pits.length) return;
      const sub = window.XC.SUBTYPE_MAP[r.subtype] || { name:"未细分" };
      const mod = window.XC.MODULES[r.module] || { name:"未分类" };
      r.pits.forEach(p=>{
        const key = r.module + "|" + (r.subtype||"") + "|" + p;
        if (!pitMap[key]) pitMap[key] = { module:r.module, subtype:r.subtype, moduleName:mod.name, subtypeName:sub.name, pit:p, count:0 };
        pitMap[key].count++;
      });
    });
    const pitRank = Object.values(pitMap).sort((a,b)=>b.count-a.count);
    const trend = buildTrend(arr, 14);
    const moduleRank = Object.entries(moduleCounts).filter(([k])=>window.XC.MODULES[k]).map(([k,v])=>({ key:k, count:v, ...window.XC.MODULES[k] })).sort((a,b)=>b.count-a.count);
    const answeredWrong = arr.filter(r=>r.myAnswer && r.correctAnswer && r.myAnswer !== r.correctAnswer).length;
    return { total, moduleCounts, subtypeCounts, moduleRank, pitRank, trend, answeredWrong, byModuleTop: moduleRank[0] || null };
  }
  function buildTrend(arr, days) {
    const out = []; const today = new Date(); today.setHours(0,0,0,0);
    const map = {};
    arr.forEach(r=>{ const d = new Date(r.createdAt); d.setHours(0,0,0,0); const diff = Math.round((today-d)/86400000); if (diff>=0 && diff<days) { const key = formatDate(d); map[key] = (map[key]||0)+1; } });
    for (let i=days-1; i>=0; i--) { const d = new Date(today); d.setDate(d.getDate()-i); const key = formatDate(d); out.push({ date:key, label:key.slice(5), count: map[key]||0 }); }
    return out;
  }
  function formatDate(d) { const m = String(d.getMonth()+1).padStart(2,"0"); const day = String(d.getDate()).padStart(2,"0"); return `${d.getFullYear()}-${m}-${day}`; }

  return { getAll, getById, add, update, remove, clearAll, stats };
})();
window.XC.Store = Store;

const UI = (() => {
  const { MODULES, SUBTYPES } = window.XC;
  function el(html){ const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }
  function escapeHtml(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
  function toast(msg, type="info", ms=2200){
    const box = document.getElementById("toast-container");
    const t = el(`<div class="toast ${type}">${escapeHtml(msg)}</div>`);
    box.appendChild(t);
    setTimeout(()=>{ t.style.opacity="0"; t.style.transition="opacity .25s"; setTimeout(()=>t.remove(),250); }, ms);
  }
  function modal({ title="", bodyHTML="", footerHTML="", onMount } = {}){
    const root = el(`<div class="modal-overlay"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h3>${escapeHtml(title)}</h3><button class="btn btn-ghost btn-sm" data-act="close">✕</button></div><div class="modal-body">${bodyHTML}</div>${footerHTML?`<div class="modal-foot">${footerHTML}</div>`:""}</div></div>`);
    document.getElementById("modal-root").appendChild(root);
    const close = ()=>{ root.remove(); };
    root.addEventListener("click", e=>{ if (e.target===root || e.target.closest('[data-act="close"]')) close(); });
    document.addEventListener("keydown", function esc(e){ if (e.key==="Escape"){ close(); document.removeEventListener("keydown", esc); } });
    if (onMount) onMount(root, close);
    return { close, root };
  }
  function confirmDialog(msg, { okText="确定", cancelText="取消", danger=false } = {}){
    return new Promise(resolve=>{
      modal({
        title:"请确认",
        bodyHTML:`<p style="font-size:14px;line-height:1.7;">${escapeHtml(msg)}</p>`,
        footerHTML:`<button class="btn" data-act="cancel">${escapeHtml(cancelText)}</button><button class="btn ${danger?"btn-danger":"btn-primary"}" data-act="ok">${escapeHtml(okText)}</button>`,
        onMount(root, close){ root.addEventListener("click", e=>{ if (e.target.closest('[data-act="ok"]')){ close(); resolve(true); } else if (e.target.closest('[data-act="cancel"]')){ close(); resolve(false); } }); }
      });
    });
  }
  function moduleTag(key, withName=true){ if (!key || !MODULES[key]) return `<span class="tag tag-muted">未分类</span>`; const m = MODULES[key]; return `<span class="tag tag-${m.key}">${m.icon} ${withName?m.name:m.short}</span>`; }
  function subtypeTag(subtypeKey){ if (!subtypeKey) return ""; const st = window.XC.SUBTYPE_MAP[subtypeKey]; if (!st) return ""; return `<span class="tag tag-muted">${escapeHtml(st.name)}</span>`; }
  function moduleOptions(selected){ return `<option value="">— 选择模块 —</option>` + Object.values(MODULES).map(m=>`<option value="${m.key}" ${selected===m.key?"selected":""}>${m.icon} ${m.name}</option>`).join(""); }
  function subtypeOptions(moduleKey, selected){ if (!moduleKey) return `<option value="">— 先选模块 —</option>`; const list = SUBTYPES.filter(s=>s.module===moduleKey); if (!list.length) return `<option value="">该模块无预设题型</option>`; return `<option value="">— 选择题型（可选）—</option>` + list.map(s=>`<option value="${s.type}" ${selected===s.type?"selected":""}>${escapeHtml(s.name)}</option>`).join(""); }
  function fileToDataURL(file, maxDim=1280, quality=0.82){
    return new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onerror = ()=>reject(new Error("读取文件失败"));
      reader.onload = ()=>{
        const dataURL = reader.result;
        const img = new Image();
        img.onload = ()=>{
          let { width:w, height:h } = img;
          if (w > maxDim || h > maxDim){ const scale = maxDim / Math.max(w,h); w = Math.round(w*scale); h = Math.round(h*scale); }
          const cv = document.createElement("canvas"); cv.width=w; cv.height=h;
          const ctx = cv.getContext("2d"); ctx.drawImage(img,0,0,w,h);
          resolve(cv.toDataURL("image/jpeg", quality));
        };
        img.onerror = ()=>resolve(dataURL);
        img.src = dataURL;
      };
      reader.readAsDataURL(file);
    });
  }
  function timeAgo(ts){ const diff = Date.now()-ts; const m = Math.floor(diff/60000); if (m<1) return "刚刚"; if (m<60) return m+" 分钟前"; const h = Math.floor(m/60); if (h<24) return h+" 小时前"; const d = Math.floor(h/24); if (d<30) return d+" 天前"; const date = new Date(ts); return `${date.getMonth()+1}/${date.getDate()}`; }
  return { el, escapeHtml, toast, modal, confirmDialog, moduleTag, subtypeTag, moduleOptions, subtypeOptions, fileToDataURL, timeAgo };
})();

  let cropState = { active:false, img:null, startX:0, startY:0, curX:0, curY:0 };
  function openCropModal(){
    if (!addState.image) return;
    const body = `
      <div style="text-align:center;color:var(--text-dim);font-size:12px;margin-bottom:10px;">拖动图片上的选框来裁剪（只保留有题目的部分）</div>
      <div style="position:relative;display:inline-block;max-width:100%;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#000;">
        <img id="crop-img" src="${addState.image}" style="max-width:100%;display:block;user-select:none;" />
        <div id="crop-box" style="position:absolute;border:2px solid var(--primary);background:rgba(79,156,249,0.15);cursor:move;min-width:20px;min-height:20px;">
          <div style="position:absolute;right:-6px;bottom:-6px;width:12px;height:12px;background:var(--primary);border-radius:50%;cursor:nwse-resize;" id="crop-handle"></div>
        </div>
      </div>`;
    UI.modal({ title:"✂️ 裁剪错题图片", bodyHTML: body, footerHTML: `<button class="btn" data-act="crop-cancel">取消</button><button class="btn btn-primary" data-act="crop-confirm">确认裁剪</button>`,
      onMount(root, close){
        const img = $("#crop-img", root); const box = $("#crop-box", root); const handle = $("#crop-handle", root);
        img.onload = ()=>{
          // 默认选框：中心区域 80%
          const w = img.offsetWidth, h = img.offsetHeight;
          const bw = w * 0.8, bh = h * 0.8;
          box.style.left = ((w-bw)/2)+"px"; box.style.top = ((h-bh)/2)+"px";
          box.style.width = bw+"px"; box.style.height = bh+"px";
        };
        box.addEventListener("mousedown", e=>{ e.stopPropagation(); startDrag(e, "move"); });
        box.addEventListener("touchstart", e=>{ e.stopPropagation(); startDrag(e.touches[0], "move"); }, {passive:true});
        handle.addEventListener("mousedown", e=>{ e.stopPropagation(); startDrag(e, "resize"); });
        handle.addEventListener("touchstart", e=>{ e.stopPropagation(); startDrag(e.touches[0], "resize"); }, {passive:true});

        function startDrag(e, mode){
          cropState.active = true; cropState.mode = mode;
          cropState.startX = (e.clientX||e.touches?.[0]?.clientX) - box.offsetLeft;
          cropState.startY = (e.clientY||e.touches?.[0]?.clientY) - box.offsetTop;
          cropState.startW = box.offsetWidth; cropState.startH = box.offsetHeight;
        }
        function onMove(e){
          if (!cropState.active) return;
          const cx = e.clientX || e.touches?.[0]?.clientX;
          const cy = e.clientY || e.touches?.[0]?.clientY;
          const imgRect = img.getBoundingClientRect();
          if (cropState.mode === "move"){
            let nx = cx - cropState.startX, ny = cy - cropState.startY;
            nx = Math.max(0, Math.min(nx, imgRect.width - box.offsetWidth));
            ny = Math.max(0, Math.min(ny, imgRect.height - box.offsetHeight));
            box.style.left = nx + "px"; box.style.top = ny + "px";
          } else {
            let nw = cropState.startW + (cx - (box.offsetLeft + cropState.startW)), nh = cropState.startH + (cy - (box.offsetTop + cropState.startH));
            nw = Math.max(20, Math.min(nw, imgRect.width - box.offsetLeft));
            nh = Math.max(20, Math.min(nh, imgRect.height - box.offsetTop));
            box.style.width = nw + "px"; box.style.height = nh + "px";
          }
        }
        function onUp(){ cropState.active = false; }
        root.addEventListener("mousemove", onMove); root.addEventListener("mouseup", onUp);
        root.addEventListener("touchmove", onMove, {passive:true}); root.addEventListener("touchend", onUp);

        root.addEventListener("click", async e=>{
          if (e.target.closest('[data-act="crop-cancel"]')){ close(); }
          if (e.target.closest('[data-act="crop-confirm"]')){
            // 实际裁剪 canvas
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");
            const imgEl = new Image(); imgEl.crossOrigin = "anonymous";
            imgEl.onload = ()=>{
              const scaleX = imgEl.naturalWidth / img.offsetWidth;
              const scaleY = imgEl.naturalHeight / img.offsetHeight;
              const sx = Math.round(box.offsetLeft * scaleX);
              const sy = Math.round(box.offsetTop * scaleY);
              const sw = Math.round(box.offsetWidth * scaleX);
              const sh = Math.round(box.offsetHeight * scaleY);
              canvas.width = sw; canvas.height = sh;
              ctx.drawImage(imgEl, sx, sy, sw, sh, 0, 0, sw, sh);
              addState.image = canvas.toDataURL("image/jpeg", 0.85);
              renderImgPreview();
              close(); UI.toast("裁剪完成 ✂️","success");
            };
            imgEl.onerror = ()=>{ close(); UI.toast("裁剪失败","error"); };
            imgEl.src = addState.image;
          }
        });
      }
    });
  }

  // === AI 看图一键解析 ===
  async function runVisionAI(){
    if (!addState.image){ UI.toast("请先上传图片","warn"); return; }
    const key = localStorage.getItem("xc_api_key");
    if (!key){ UI.modal({ title:"🔑 还没设置 API Key", bodyHTML:`
      <div style="padding:8px 0;">
        <p style="margin:0 0 10px;font-size:14px;">AI 看图解析需要调用视觉模型 API。</p>
        <p class="muted" style="margin:0 0 12px;font-size:12px;">最简单的方式：注册 <a href="https://cloud.siliconflow.cn/" target="_blank" style="color:var(--primary);">硅基流动</a>（免费送额度），创建 API Key 粘贴到下方。</p>
        <label style="font-size:13px;color:var(--text-dim);">API Key</label>
        <input id="vision-key" placeholder="sk-xxxxxx" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;margin:4px 0 10px;" />
        <label style="font-size:13px;color:var(--text-dim);">模型（默认 Qwen2.5-VL）</label>
        <input id="vision-model" value="${localStorage.getItem('xc_api_vision_model')||'Qwen/Qwen2.5-VL-7B-Instruct'}" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;margin:4px 0 10px;font-size:12px;" />
        <p class="muted" style="margin:8px 0 0;font-size:11px;">💡 已填过 API Key？直接点下方"设置 API Key + 联网解析"按钮复用。</p>
      </div>`, footerHTML:`<button class="btn" data-act="vision-cancel">取消</button><button class="btn btn-primary" data-act="vision-save">保存并解析</button>` }); return; }
    const endpoint = localStorage.getItem("xc_api_endpoint") || "https://api.siliconflow.cn/v1/chat/completions";
    const model = localStorage.getItem("xc_api_vision_model") || "Qwen/Qwen2.5-VL-7B-Instruct";

    const status = $("#ocr-status");
    const btn = document.querySelector('[data-act="vision-ai"]');
    if (btn) btn.disabled = true; btn.textContent = "⏳ AI 正在看图解析…";
    status.innerText = "发送图片给视觉模型…";

    // 压缩图片到 base64
    let imageData = addState.image;
    if (imageData.length > 2000000) {
      const canvas = document.createElement("canvas"); const ctx = canvas.getContext("2d");
      const img = new Image(); img.crossOrigin = "anonymous";
      await new Promise((res,rej)=>{ img.onload = res; img.onerror = rej; img.src = imageData; });
      const maxW = 1200, maxH = 1600; let w = img.naturalWidth, h = img.naturalHeight;
      if (w > maxW || h > maxH){ const r = Math.min(maxW/w, maxH/h); w = Math.round(w*r); h = Math.round(h*r); }
      canvas.width = w; canvas.height = h; ctx.drawImage(img, 0, 0, w, h);
      imageData = canvas.toDataURL("image/jpeg", 0.8);
    }

    const prompt = `请识别这张图片中的公务员考试行测题目，然后进行深度解析。

请严格按以下 JSON 格式返回（用中文，不要返回 JSON 以外的任何内容）：
{
  "text": "完整的题目文字，包含题干和所有选项",
  "module": "以下之一：speech（言语理解）/judge（判断推理）/data（资料分析）/quant（数量关系）/common（常识判断）",
  "myAnswer": "如果图片中标注了你选的错误答案，这里填字母；否则留空字符串",
  "correctAnswer": "如果图片中标注了正确答案，这里填字母；否则根据题目内容推断正确答案字母",
  "analysis": {
    "correctReason": "正确选项为什么对的详细分析，紧扣考点和逻辑",
    "wrongReason": "逐个分析每个错误选项为什么错，指出陷阱类型",
    "skillReason": "这类题的通用解题技巧和避坑要点"
  }
}`;

    try {
      const resp = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type":"application/json", "Authorization":"Bearer "+key },
        body: JSON.stringify({ model, messages:[{role:"user", content:[
          {type:"image_url", image_url:{ url:imageData }},
          {type:"text", text:prompt }
        ]}], temperature:0.3, max_tokens:2000 })
      });
      if (!resp.ok){ const err = await resp.text(); throw new Error(`HTTP ${resp.status}: ${err.slice(0,150)}`); }
      const data = await resp.json();
      const raw = (data.choices?.[0]?.message?.content) || "";
      // 从返回里提取 JSON
      const jsonMatch = raw.match(/\{[\s\S]*\}/);
      let parsed = null;
      try { parsed = jsonMatch ? JSON.parse(jsonMatch[0]) : null; } catch(e){ parsed = null; }

      if (!parsed){
        status.innerText = "⚠️ AI 返回了内容但格式不对，尝试手动粘贴";
        const ta = $("#q-text"); ta.value = raw; addState.text = raw; runAnalysis();
        UI.toast("AI 返回了文字但没结构化，请手动核对","warn");
      } else {
        // 自动填入所有字段
        if (parsed.text){ const ta = $("#q-text"); ta.value = parsed.text; addState.text = parsed.text; runAnalysis(); }
        if (parsed.myAnswer){ const el = $("#my-ans"); if(el) el.value = parsed.myAnswer.trim(); }
        if (parsed.correctAnswer){ const el = $("#ok-ans"); if(el) el.value = parsed.correctAnswer.trim(); }
        if (parsed.module){ addState.module = parsed.module; const sel = $("#m-module"); if(sel) sel.value = parsed.module; UI.subtypeOptions(parsed.module); renderAIPreview({module:parsed.module}); }

        // 把 AI 拆解粘到手动框
        if (parsed.analysis){
          const manualBox = $("#manual-ai-analysis");
          if (manualBox){
            let aiText = "";
            if (parsed.analysis.correctReason) aiText += "✅ 正确选项的核心逻辑：\n" + parsed.analysis.correctReason + "\n\n";
            if (parsed.analysis.wrongReason) aiText += "❌ 错误选项陷阱拆解：\n" + parsed.analysis.wrongReason + "\n\n";
            if (parsed.analysis.skillReason) aiText += "💡 解题技巧：\n" + parsed.analysis.skillReason;
            if (aiText) manualBox.value = aiText;
          }
        }

        status.innerHTML = `<span style="color:var(--success);">✅ 全部填入完成！检查一下题目文字和答案是否正确，然后点保存。</span>`;
        UI.toast("AI 看图解析完成！","success",2500);
      }
    } catch(e) {
      status.innerText = "❌ 调用失败：" + (e.message||"") + "（可检查 API Key 或用下方 OCR + 手动输入替代）";
      UI.toast("AI 看图解析失败","error");
    } finally {
      if (btn){ btn.disabled = false; btn.textContent = "🖼️ AI 看图一键解析（需要 API Key）"; }
    }
  }

  // === OCR 图片文字识别 ===
  let tesseractLoader = null;
  async function loadTesseract(){
    if (tesseractLoader) return tesseractLoader;
    tesseractLoader = new Promise((resolve,reject)=>{
      if (window.Tesseract){ resolve(window.Tesseract); return; }
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js";
      s.onload = ()=>resolve(window.Tesseract);
      s.onerror = ()=>reject(new Error("Tesseract.js 加载失败，请检查网络"));
      document.head.appendChild(s);
    });
    return tesseractLoader;
  }
  async function runOCR(){
    if (!addState.image){ UI.toast("请先上传图片","warn"); return; }
    const status = $("#ocr-status");
    const btn = document.querySelector('[data-act="ocr-extract"]');
    if (btn) btn.disabled = true;
    try {
      status.innerText = "正在加载 OCR 引擎…（首次需下载约 2MB）";
      const Tesseract = await loadTesseract();
      status.innerText = "正在识别图片文字…（中文识别需 10-30 秒）";
      const result = await Tesseract.recognize(addState.image, "chi_sim+eng", {
        logger: m => {
          if (m.status === "recognizing text"){
            status.innerText = `正在识别… ${Math.round(m.progress*100)}%`;
          } else if (m.status === "loading tesseract core"){
            status.innerText = `加载识别引擎… ${Math.round(m.progress*100)}%`;
          } else if (m.status === "loading language traineddata"){
            status.innerText = `加载中文语言包… ${Math.round(m.progress*100)}%`;
          }
        }
      });
      const text = (result?.data?.text || "").replace(/\n{3,}/g, "\n\n").trim();
      if (!text){ status.innerText = "⚠️ 未能识别出文字，请确认图片清晰度"; return; }
      const ta = $("#q-text");
      const existing = (ta.value||"").trim();
      ta.value = existing ? existing + "\n\n" + text : text;
      addState.text = ta.value;
      status.innerHTML = `✅ 识别完成！<span style="color:var(--success);">${text.length}</span> 字已填入题目框`;
      UI.toast("OCR 识别成功！","success");
      runAnalysis();
      triggerAI();
    } catch(e) {
      status.innerText = "❌ 识别失败：" + (e.message||"未知错误") + "（可尝试上传更清晰的图片，或直接手动输入文字）";
      UI.toast("OCR 失败："+(e.message||""),"error");
    } finally {
      if (btn) btn.disabled = false;
    }
  }
  function runAnalysis(){
    const text = addState.text.trim();
    const out = $("#analysis-out");
    if (!text){ out.innerHTML = `<p class="muted" style="font-size:13px;">输入或粘贴题目后，这里会出现自动判别结果。</p>`; return; }
    const result = Analyzer.analyze(text); addState.lastAnalysis = result;
    out.innerHTML = renderAnalysisPreview(result);
    if (!addState.applied && result.module){
      addState.module = result.module; addState.subtype = result.subtype;
      const selM = $("#m-module"); if (selM) selM.value = result.module;
      const selS = $("#m-subtype"); if (selS) selS.innerHTML = UI.subtypeOptions(result.module, result.subtype);
      addState.applied = true; refreshPits(result.pits);
    }
  }
  function renderAnalysisPreview(r){
    if (r.unknown) return `<div class="analysis-box" style="border-color:var(--warn);"><div class="ab-row"><span class="ab-label">判别</span><span class="tag tag-muted">未能自动识别</span></div><div class="reasoning">${UI.escapeHtml(r.reasoning)}</div></div>`;
    const mod = MODULES[r.module]; const sub = r.subtype ? SUBTYPE_MAP[r.subtype] : null;
    const confBar = `<div style="height:6px;background:var(--bg-soft);border-radius:3px;margin-top:8px;overflow:hidden;"><div style="width:${r.confidence}%;height:100%;background:var(--primary);"></div></div>`;

    // --- 错题拆解详细展示 ---
    let breakdown = "";
    if (sub) {
      // 考点
      breakdown += `<div style="margin-top:12px;padding:10px 12px;background:rgba(79,156,249,.08);border-left:3px solid var(--primary);border-radius:0 8px 8px 0;"><b style="color:var(--primary);font-size:12px;">📌 考点拆解</b><div style="margin-top:4px;font-size:13px;color:var(--text-dim);line-height:1.7;">${UI.escapeHtml(sub.logic)}</div></div>`;
      // 踩坑预警
      breakdown += `<div style="margin-top:10px;"><b style="color:var(--accent);font-size:12px;">⚠️ 高频踩坑预警</b>`;
      sub.pits.forEach((p,i)=>{
        breakdown += `<div style="margin-top:4px;padding:6px 10px;background:rgba(255,181,71,.06);border-left:2px solid var(--accent);border-radius:0 6px 6px 0;font-size:12px;color:var(--text-dim);">${i+1}. ${UI.escapeHtml(p)}</div>`;
      });
      breakdown += `</div>`;
      // 举一反三
      const moduleHints = {
        speech: "遇到言语题先抓关联词（但/因此/可见），主旨题选'全面概括'不选'片面细节'；逻辑填空先看逻辑关系再辨析词义。",
        judge: "图形推理先看数量（点线面）再看位置；定义判断逐要件比对；逻辑判断先找论点再看削弱/加强方向。",
        data: "资料分析先看问题再找数据，增长率=（现期-基期）/基期；比重变化看部分率vs整体率；综合题先验易排除项。",
        quant: "数学运算优先代入排除/特值法；行程分清相遇追及；排列组合A有序C无序；概率善用对立事件。",
        common: "常识题优先排除绝对化表述（所有/一定/唯一）；时政记关键词；法律区分应当vs可以。"
      };
      const hint = moduleHints[r.module] || "";
      if (hint) {
        breakdown += `<div style="margin-top:10px;padding:10px 12px;background:rgba(79,209,165,.08);border-radius:8px;font-size:12px;color:var(--text-dim);line-height:1.7;">💡 <b style="color:var(--success);">举一反三</b>：${UI.escapeHtml(hint)}</div>`;
      }
    } else {
      // 仅模块级别
      const modHints = {
        speech: "言语理解核心：抓关键词（转折/递进/因果关联词后是重点）、辨析近义词侧重点、区分主旨vs细节。",
        judge: "判断推理核心：图形看规律（数量+位置）、定义拆要件逐一对比、类比看关系+二级辨析、逻辑找论证结构。",
        data: "资料分析核心：先看问题再找材料、增长率/比重/倍数公式记牢、综合题优先排除易判选项。",
        quant: "数量关系核心：优先代入排除/特值法、行程工程套用模型、排列组合注意有序/无序。",
        common: "常识判断核心：绝对化表述优先排除、时政记关键词、法律区分应当/可以、经济记易混概念。"
      };
      breakdown += `<div style="margin-top:12px;padding:10px 12px;background:rgba(79,156,249,.08);border-left:3px solid var(--primary);border-radius:0 8px 8px 0;"><b style="color:var(--primary);font-size:12px;">📌 模块备考重点</b><div style="margin-top:4px;font-size:13px;color:var(--text-dim);line-height:1.7;">${UI.escapeHtml(modHints[r.module]||"")}</div><div class="muted" style="font-size:11px;margin-top:6px;">💡 建议手动选择具体题型，获取更精准的拆解</div></div>`;
    }

    return `<div class="analysis-box"><div class="ab-row"><span class="ab-label">模块</span>${UI.moduleTag(r.module)}${sub?`<span class="ab-label" style="margin-left:10px;">题型</span><span class="tag tag-muted">${UI.escapeHtml(sub.name)}</span>`:""}<span class="confidence" style="margin-left:auto;">置信度 ${r.confidence}%</span></div>${confBar}<div class="reasoning">${UI.escapeHtml(r.reasoning)}</div>${breakdown}</div>`;
  }

    const totalAnswered = s.answeredWrong;
    const moduleBars = s.moduleRank.map(m=>`<div class="bar-row"><div class="bl-name">${m.icon} ${m.short}</div><div class="bar-track"><div class="bar-fill" style="width:${(m.count/maxMod*100).toFixed(0)}%;background:${m.color};"></div></div><div class="bl-val">${m.count} 题</div></div>`).join("");
    const subRows = Object.entries(s.subtypeCounts).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([t,c])=>{ const st = SUBTYPE_MAP[t]; if (!st) return ""; return `<div class="pit-rank-item"><div class="pit-rank-num">${c}</div><div class="pit-rank-body"><div class="prb-head">${UI.moduleTag(st.module,false)} <span style="font-size:13px;">${UI.escapeHtml(st.name)}</span></div></div></div>`; }).join("");
    const pitRank = s.pitRank.slice(0,6).map((p,i)=>`<div class="pit-rank-item ${i===0?"top1":i===1?"top2":i===2?"top3":""}"><div class="pit-rank-num">${i+1}</div><div class="pit-rank-body"><div class="prb-head">${UI.moduleTag(p.module,false)} ${p.subtypeName?`<span class="tag tag-muted">${UI.escapeHtml(p.subtypeName)}</span>`:""} <span class="prb-count">×${p.count}</span></div><div class="prb-pit">${UI.escapeHtml(p.pit)}</div></div></div>`).join("") || `<p class="muted" style="font-size:13px;">暂无踩坑数据（保存错题时勾选的踩坑会在此统计）。</p>`;
    const trendBars = s.trend.map(t=>`<div class="trend-bar" style="height:${(t.count/trendMax*100).toFixed(0)}%;">${t.count?`<div class="tb-tip">${t.count}</div>`:""}</div>`).join("");
    const trendX = s.trend.map(t=>`<span>${t.label}</span>`).join("");
    const advice = buildAdvice(s);
    return `<div class="stat-cards">
        <div class="stat-card"><div class="sc-label">错题总数</div><div class="sc-value">${s.total}</div><div class="sc-sub">${totalAnswered?`已标注 ${totalAnswered} 题错误答案`:"建议补充答案便于复盘"}</div></div>
        <div class="stat-card"><div class="sc-label">错最多模块</div><div class="sc-value" style="color:${s.byModuleTop?s.byModuleTop.color:"var(--text)"};">${s.byModuleTop?s.byModuleTop.short:"—"}</div><div class="sc-sub">${s.byModuleTop?`${s.byModuleTop.count} 题 · 占 ${(s.byModuleTop.count/s.total*100).toFixed(0)}%`:"暂无数据"}</div></div>
        <div class="stat-card"><div class="sc-label">最高频踩坑</div><div class="sc-value" style="font-size:18px;line-height:1.3;">${topPit?UI.escapeHtml(truncate(topPit.pit,14)):"—"}</div><div class="sc-sub">${topPit?`×${topPit.count} 次 · ${topPit.subtypeName}`:"暂无"}</div></div>
        <div class="stat-card"><div class="sc-label">近14天记录</div><div class="sc-value">${s.trend.reduce((a,b)=>a+b.count,0)}</div><div class="sc-sub">${s.trend.filter(t=>t.count).length} 天有记录</div></div>
      </div>
      <div class="grid grid-2">
        <div class="card"><div class="card-title"><span class="dot"></span>各模块错题分布</div>${moduleBars||`<p class="muted">暂无数据</p>`}</div>
        <div class="card"><div class="card-title"><span class="dot"></span>近 14 天错题趋势</div><div class="trend-chart">${trendBars}</div><div class="trend-x">${trendX}</div></div>
      </div>
      <div class="card"><div class="card-title"><span class="dot" style="background:var(--accent);"></span>高频踩坑 Top 6</div>${pitRank}</div>
      <div class="grid grid-2">
        <div class="card"><div class="card-title"><span class="dot" style="background:var(--success);"></span>题型分布</div>${subRows||`<p class="muted" style="font-size:13px;">暂无题型数据。</p>`}</div>
        <div class="card"><div class="card-title"><span class="dot" style="background:var(--primary);"></span>🎯 个性化诊断建议</div>${advice}</div>
      </div>`;
  }
  function buildAdvice(s){
    if (!s.total) return `<p class="muted">暂无数据。</p>`;
    const top = s.byModuleTop; if (!top) return `<p class="muted">暂无模块数据。</p>`;
    const list = SUBTYPES.filter(st=>st.module===top.key);
    const topPits = s.pitRank.filter(p=>p.module===top.key).slice(0,3);
    let html = `<div style="font-size:13px;line-height:1.8;color:var(--text-dim);">你在 <b style="color:${top.color};">${top.name}</b> 模块错题最多（${top.count} 题，占 ${(top.count/s.total*100).toFixed(0)}%），建议优先突破。该模块含 ${list.length} 类题型，重点题型与常见坑如下：</div><div class="mt-12">`;
    list.forEach(st=>{ const cnt = s.subtypeCounts[st.type]||0; html += `<div style="margin-bottom:10px;"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;"><b>${UI.escapeHtml(st.name)}</b><span class="muted">${cnt} 题</span></div><ul style="margin:0;padding-left:18px;font-size:12px;color:var(--text-dim);">${st.pits.slice(0,3).map(p=>`<li>${UI.escapeHtml(p)}</li>`).join("")}</ul></div>`; });
    html += `</div>`;
    if (topPits.length){ html += `<div class="section-label" style="margin-top:8px;">你在该模块最常踩的坑</div><ul style="margin:0;padding-left:18px;font-size:12px;color:var(--accent);">`; topPits.forEach(p=>html+=`<li>×${p.count} · ${UI.escapeHtml(p.pit)}</li>`); html += `</ul>`; }
    return html;
  }
  function truncate(s,n){ return s.length>n?s.slice(0,n)+"…":s; }

  function start(){
    window.addEventListener("hashchange", ()=>{ render(); window.scrollTo(0,0); });
    render();
  }
  return { start };
})();

document.addEventListener("DOMContentLoaded", App.start);
</script>
</body>
</html>
