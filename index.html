<html lang="zh-CN">

<style>
:root {
  --bg: #0f1420; --bg-soft: #161d2e; --panel: #1c2538; --panel-2: #232e45;
  --border: #2c3956; --text: #e8edf7; --text-dim: #9aa7c2; --text-mute: #6b7795;
  --primary: #4f9cf9; --primary-soft: rgba(79,156,249,0.14); --accent: #ffb547;
  --danger: #ff6b6b; --success: #4fd1a5; --warn: #f5a623;
  --m-speech: #5b8def; --m-judge: #b06bff; --m-data: #2ec1a0; --m-quant: #ff8a5b; --m-common: #f6c347;
  --radius: 14px; --radius-sm: 9px; --shadow: 0 10px 30px rgba(0,0,0,0.35); --maxw: 1080px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.6}
#app{min-height:100vh;display:flex;flex-direction:column}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--text);background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
textarea{resize:vertical;min-height:120px;line-height:1.6}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;padding:14px 24px;background:rgba(22,29,46,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:.5px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--accent));display:grid;place-items:center;font-size:16px;color:#0f1420;font-weight:800}
.topbar .nav{display:flex;gap:4px;margin-left:8px}
.topbar .nav a{padding:8px 14px;border-radius:8px;color:var(--text-dim);font-size:14px;font-weight:500}
.topbar .nav a.active{background:var(--primary-soft);color:var(--primary)}
.topbar .nav a:hover{text-decoration:none;color:var(--text)}
.topbar .spacer{flex:1}
.topbar .stat-mini{color:var(--text-dim);font-size:13px}
.topbar .back-btn{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:6px;background:var(--bg-soft);color:var(--text);border:1px solid var(--border);font-size:13px;font-weight:500;cursor:pointer}
.topbar .back-btn:hover{background:var(--border)}
.main{flex:1;padding:28px 24px 100px;max-width:var(--maxw);margin:0 auto;width:100%}
.page-head{margin-bottom:22px;display:flex;align-items:center;gap:14px}
.page-head .page-head-main{flex:1}
.page-head h1{font-size:24px;letter-spacing:.3px}
.page-head p{color:var(--text-dim);margin-top:6px;font-size:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card+.card{margin-top:16px}
.card-title{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-title .dot{width:8px;height:8px;border-radius:50%;background:var(--primary)}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media (max-width:880px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;background:var(--panel-2);color:var(--text);border:1px solid var(--border);transition:transform .08s,background .15s,border-color .15s}
.btn:hover{background:var(--border)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:#3d8be0}
.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn-danger:hover{background:rgba(255,107,107,.12)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-dim)}
.btn-ghost:hover{background:var(--bg-soft);color:var(--text)}
.btn-sm{padding:5px 10px;font-size:12px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid transparent}
.tag-speech{background:rgba(91,141,239,.14);color:var(--m-speech);border-color:rgba(91,141,239,.35)}
.tag-judge{background:rgba(176,107,255,.14);color:var(--m-judge);border-color:rgba(176,107,255,.35)}
.tag-data{background:rgba(46,193,160,.14);color:var(--m-data);border-color:rgba(46,193,160,.35)}
.tag-quant{background:rgba(255,138,91,.14);color:var(--m-quant);border-color:rgba(255,138,91,.35)}
.tag-common{background:rgba(246,195,71,.14);color:var(--m-common);border-color:rgba(246,195,71,.35)}
.form-row{margin-bottom:16px}
.form-row>label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:6px;font-weight:500}
.form-row .hint{font-size:12px;color:var(--text-mute);margin-top:5px}
.dropzone{border:2px dashed var(--border);border-radius:var(--radius);padding:24px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;color:var(--text-dim);display:block}
.dropzone:hover,.dropzone.drag{border-color:var(--primary);background:var(--primary-soft);color:var(--text)}
.dropzone .dz-icon{font-size:28px;margin-bottom:8px}
.dropzone input{display:none}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;background:rgba(22,29,46,.95);backdrop-filter:blur(10px);border-top:1px solid var(--border);max-width:var(--maxw);margin:0 auto}
.tabbar a{flex:1;padding:12px 0;text-align:center;color:var(--text-mute);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar a .tb-ico{font-size:18px}
.tabbar a.active{color:var(--primary)}
.tabbar a:hover{text-decoration:none;color:var(--text)}
@media (min-width:880px){.tabbar{display:none}}
@media (max-width:880px){.topbar .nav{display:none}.main{padding-bottom:80px}}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:9999;padding:10px 20px;border-radius:8px;color:#fff;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,0.2);animation:toastIn .25s ease}
.toast.success{background:#10b981}
.toast.error{background:#ff4d4f}
.toast.warn{background:#faad14}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
.empty{text-align:center;padding:60px 20px;color:var(--text-mute)}
.empty .em-icon{font-size:42px;margin-bottom:10px;opacity:.6}
.empty h3{color:var(--text-dim);margin-bottom:6px;font-size:16px}

/* ---- 详情页专用 ---- */
.detail-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.detail-img{max-width:100%;border-radius:8px;border:1px solid var(--border);margin-bottom:14px}
.detail-text{background:var(--bg-soft);padding:16px;border-radius:10px;font-size:15px;line-height:1.8;white-space:pre-wrap;margin-bottom:14px;border-left:3px solid var(--primary)}
.detail-ans{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.detail-ans .da{flex:1;min-width:200px;padding:12px 14px;border-radius:10px;font-size:14px}
.detail-ans .da-mine{background:#fff1f0;border:1px solid #ffa39e;color:#cf1322}
.detail-ans .da-right{background:#f6ffed;border:1px solid #b7eb8f;color:#389e0d}
.detail-block{background:var(--bg-soft);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.detail-block .db-label{font-size:12px;color:var(--text-mute);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.detail-block .db-body{font-size:14px;line-height:1.8;white-space:pre-wrap}
.detail-block.db-note{border-left:3px solid var(--warn)}
.detail-block.db-ai{background:linear-gradient(135deg,rgba(102,126,234,0.1),rgba(118,75,162,0.1));border:1px solid rgba(102,126,234,0.3);border-left:3px solid #667eea}
.detail-foot{position:sticky;bottom:0;padding:14px 0;display:flex;gap:10px;justify-content:flex-end;background:var(--bg);border-top:1px solid var(--border);margin-top:12px}

/* ---- 统计卡 ---- */
.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
@media (max-width:880px){.stat-cards{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;text-align:center}
.stat-card .sc-label{font-size:12px;color:var(--text-mute)}
.stat-card .sc-value{font-size:28px;font-weight:700;margin-top:4px;letter-spacing:.5px}

/* ---- 列表卡 ---- */
.q-card{padding:14px;border:1px solid var(--border);border-radius:10px;margin-bottom:10px;cursor:pointer;transition:all .15s}
.q-card:hover{border-color:var(--primary);background:var(--bg-soft)}
.q-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.q-card-main{flex:1;min-width:0}
.q-card-meta{margin-bottom:6px}
.q-card-text{font-size:14px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.q-card-info{margin-top:8px;display:flex;gap:12px;font-size:13px;flex-wrap:wrap}
</style>
</head>

<!-- docx UMD (正确路径) -->
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>

<script>
(function(){
  if (!Element.prototype.matches) Element.prototype.matches = Element.prototype.msMatchesSelector || Element.prototype.webkitMatchesSelector;
  if (!Element.prototype.closest) Element.prototype.closest = function(s){ if(!document.documentElement.contains(this)) return null; if(this.matches(s)) return this; if(this.parentElement) return this.parentElement.closest(s); return null; };
})();

const Analyzer = (() => {
  const MODULES = [
    {id:"speech", name:"言语理解", color:"#5b8def", subtypes:[
      {id:"logic", name:"逻辑填空"},{id:"reading", name:"片段阅读"},{id:"order", name:"语句排序"},{id:"fill", name:"语句填空"},{id:"title", name:"标题添加"}
    ]},
    {id:"judge", name:"判断推理", color:"#b06bff", subtypes:[
      {id:"graph", name:"图形推理"},{id:"define", name:"定义判断"},{id:"analog", name:"类比推理"},{id:"logic", name:"逻辑判断"}
    ]},
    {id:"data", name:"资料分析", color:"#2ec1a0", subtypes:[
      {id:"growth", name:"增长相关"},{id:"proportion", name:"比重相关"},{id:"compare", name:"倍数与比值"},{id:"average", name:"平均数与中位数"},{id:"combo", name:"综合分析"}
    ]},
    {id:"quant", name:"数量关系", color:"#ff8a5b", subtypes:[
      {id:"行程", name:"行程问题"},{id:"工程", name:"工程问题"},{id:"利润", name:"利润问题"},{id:"概率", name:"概率问题"},{id:"几何", name:"几何问题"},{id:"数列", name:"数列问题"},{id:"其他", name:"其他"}
    ]},
    {id:"common", name:"常识判断", color:"#f6c347", subtypes:[
      {id:"law", name:"法律常识"},{id:"polity", name:"政治常识"},{id:"history", name:"历史文化"},{id:"science", name:"科技地理"},{id:"life", name:"生活百科"}
    ]}
  ];
  const SUBTYPE_MAP = {}; MODULES.forEach(m=>m.subtypes.forEach(s=>SUBTYPE_MAP[s.id]=s));
  return { MODULES, SUBTYPE_MAP };
})();

const Store = (() => {
  const KEY = "xc_mistakes_v7";
  function getAll(){ try { return JSON.parse(localStorage.getItem(KEY)||"[]"); } catch(e){ return []; } }
  function save(arr){ try { localStorage.setItem(KEY, JSON.stringify(arr)); } catch(e){ throw new Error("存储失败：截图可能过大"); } }
  function list(){ return getAll(); }
  function get(id){ return getAll().find(r=>r.id===id); }
  function add(rec){ const arr = getAll(); rec.id = Date.now().toString(36)+Math.random().toString(36).slice(2,6); rec.createdAt = Date.now(); arr.unshift(rec); save(arr); return rec; }
  function update(id, data){ const arr = getAll(); const i = arr.findIndex(r=>r.id===id); if(i>=0){ arr[i] = { ...arr[i], ...data }; save(arr); return arr[i]; } return null; }
  function remove(id){ save(getAll().filter(r=>r.id!==id)); }
  function clear(){ save([]); }
  return { getAll, list, get, add, update, remove, clear };
})();

const UI = (() => {
  function el(html){ const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; }
  function escapeHtml(s){ if(!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
  function toast(msg, type="info", dur=2200){
    const map = { error:"#ff4d4f", warn:"#faad14", info:"#10b981", success:"#10b981" };
    const t = el(`<div class="toast ${type}">${escapeHtml(msg)}</div>`);
    document.body.appendChild(t);
    setTimeout(()=>{ t.style.opacity="0"; setTimeout(()=>t.remove(), 200); }, dur);
  }
  function moduleName(id){ const m = Analyzer.MODULES.find(m=>m.id===id); return m?m.name:(id||"未分类"); }
  function moduleColor(id){ const m = Analyzer.MODULES.find(m=>m.id===id); return m?m.color:"#999"; }
  function subtypeName(moduleId, subtypeId){
    const m = Analyzer.MODULES.find(x=>x.id===moduleId);
    const s = (m?.subtypes||[]).find(x=>x.id===subtypeId);
    return s?s.name:"";
  }
  function moduleTag(id){ const c = moduleColor(id), n = moduleName(id); return `<span class="tag" style="background:${c}20;color:${c};border-color:${c}50;">${n}</span>`; }
  function subtypeTag(id){ const s = Analyzer.SUBTYPE_MAP[id]; return s ? `<span class="tag" style="background:var(--bg-soft);color:var(--text-dim);border:1px solid var(--border);">${s.name}</span>` : ""; }
  function moduleOptions(selected){ return `<option value="">请选择</option>` + Analyzer.MODULES.map(m=>`<option value="${m.id}" ${selected===m.id?"selected":""}>${m.name}</option>`).join(""); }
  function subtypeOptions(moduleId, selected){
    const m = Analyzer.MODULES.find(m=>m.id===moduleId);
    if (!m) return `<option value="">先选模块</option>`;
    return `<option value="">请选择</option>` + m.subtypes.map(s=>`<option value="${s.id}" ${selected===s.id?"selected":""}>${s.name}</option>`).join("");
  }
  function fileToDataURL(file){ return new Promise((res,rej)=>{
    if (!file.type.startsWith("image/")) return rej(new Error("请上传图片"));
    const reader = new FileReader(); reader.onload = ()=>{
      const img = new Image(); img.onload = ()=>{
        const maxW=1200, maxH=1600; let w=img.naturalWidth, h=img.naturalHeight;
        if (w>maxW||h>maxH){ const r=Math.min(maxW/w,maxH/h); w=Math.round(w*r); h=Math.round(h*r); }
        const c=document.createElement("canvas"); c.width=w; c.height=h; const ctx=c.getContext("2d"); ctx.drawImage(img,0,0,w,h); res(c.toDataURL("image/jpeg",0.85));
      }; img.onerror = ()=>rej(new Error("图片加载失败")); img.src = reader.result;
    }; reader.onerror = ()=>rej(new Error("读取失败")); reader.readAsDataURL(file);
  }); }
  function timeAgo(ts){
    if (!ts) return ""; const diff = Date.now() - ts;
    if (diff < 60000) return "刚刚"; if (diff < 3600000) return Math.floor(diff/60000)+"分钟前";
    if (diff < 86400000) return Math.floor(diff/3600000)+"小时前"; if (diff < 604800000) return Math.floor(diff/86400000)+"天前";
    return new Date(ts).toLocaleDateString();
  }
  function goto(hash){ location.hash = hash; }
  return { el, escapeHtml, toast, moduleName, moduleColor, subtypeName, moduleTag, subtypeTag, moduleOptions, subtypeOptions, fileToDataURL, timeAgo, goto };
})();

const App = (() => {
  const $ = (s, r=document) => r.querySelector(s);
  let addState = { text:"", image:null, module:"", subtype:"" };

  // ---- 路由 ----
  // 支持 #/detail/id  和  #/edit/id  形式
  function parseRoute(){
    const raw = location.hash.replace(/^#/, "") || "/add";
    const parts = raw.split("/").filter(Boolean);  // ["add"] 或 ["detail","abc123"]
    return { path: "/" + parts.join("/"), parts };
  }
  function currentRoute(){
    const { path, parts } = parseRoute();
    if (path === "/add") return { route:"add", id:null };
    if (path === "/list") return { route:"list", id:null };
    if (path === "/stats") return { route:"stats", id:null };
    if (parts[0] === "detail" && parts[1]) return { route:"detail", id:parts[1] };
    if (parts[0] === "edit" && parts[1]) return { route:"edit", id:parts[1] };
    return { route:"add", id:null };
  }

  // ---- shell ----
  function shell(info){
    const { route } = info;
    const count = Store.getAll().length;
    const showTabbar = ["add","list","stats"].includes(route);
    const isMain = showTabbar; // 是否主tab路由（决定导航高亮）
    const navItem = (h,label,key)=>`<a href="#${h}" class="${(route===key)?"active":""}" data-link="${h}">${label}</a>`;
    const tabItem = (h,label,ico,key)=>`<a href="#${h}" class="${(route===key)?"active":""}" data-link="${h}"><span class="tb-ico">${ico}</span>${label}</a>`;
    return `<header class="topbar"><div class="brand"><span class="logo">行</span><span>行测错题本</span></div><nav class="nav">${navItem("/add","录入错题","add")}${navItem("/list","错题本","list")}${navItem("/stats","分析报告","stats")}</nav><div class="spacer"></div><div class="stat-mini">已记录 ${count} 题</div></header><main class="main" id="page"></main>${showTabbar?`<nav class="tabbar">${tabItem("/add","录入","✎","add")}${tabItem("/list","错题本","▤","list")}${tabItem("/stats","分析","📊","stats")}</nav>`:""}`;
  }

  // ---- render 调度 ----
  function render(){
    const info = currentRoute();
    document.getElementById("app").innerHTML = shell(info);
    const map = {
      add: renderAdd,
      list: renderList,
      stats: renderStats,
      detail: renderDetail,
      edit: renderEdit
    };
    map[info.route](info.id);
  }

  // ============================================================
  //  录入页
  // ============================================================
  function renderAdd(){
    $("#page").innerHTML = `
      <div class="page-head"><div class="page-head-main"><h1>录入错题</h1><p>粘贴题目文字或上传截图，选模块题型，填写答题信息和 AI 解析。</p></div></div>
      <div class="grid grid-2">
        <div>
          <div class="card">
            <div class="card-title"><span class="dot"></span>题目内容</div>
            <div class="form-row"><label>题目文字</label><textarea id="q-text" placeholder="把题目（含题干和选项）粘贴到这里…">${UI.escapeHtml(addState.text)}</textarea></div>
          </div>
          <div class="card">
            <div class="card-title"><span class="dot"></span>错题截图（可选）</div>
            <label class="dropzone" id="dz"><div class="dz-icon">🖼️</div><div>点击上传或拖入图片</div><div class="hint">PNG / JPG，自动压缩</div><input type="file" id="q-file" accept="image/*" /></label>
            <div id="img-preview"></div>
          </div>
        </div>
        <div>
          <div class="card">
            <div class="card-title"><span class="dot" style="background:var(--primary);"></span>模块 & 题型（必选）</div>
            <div class="grid grid-2">
              <div class="form-row" style="margin:0;"><label>所属模块</label><select id="m-module">${UI.moduleOptions(addState.module)}</select></div>
              <div class="form-row" style="margin:0;"><label>具体题型</label><select id="m-subtype">${UI.subtypeOptions(addState.module, addState.subtype)}</select></div>
            </div>
          </div>
          <div class="card">
            <div class="card-title"><span class="dot"></span>答题信息</div>
            <div class="form-row"><label>我的错误答案</label><input id="my-ans" type="text" placeholder="例如：B" /></div>
            <div class="form-row"><label>正确答案</label><input id="ok-ans" type="text" placeholder="例如：D" /></div>
            <div class="form-row"><label>我的错误原因（自己写）</label><textarea id="note" placeholder="你为什么做错了？哪一步没考虑到？…"></textarea></div>
          </div>
          <div class="card">
            <div class="card-title"><span class="dot" style="background:#667eea;"></span>AI 深度解析（粘贴从 AI 获取的）</div>

  // ============================================================
  //  Word 导出
  // ============================================================
  function exportWord(){
    if (typeof docx === 'undefined'){ UI.toast('docx库未加载，请刷新页面后重试','error'); return; }
    if (typeof saveAs === 'undefined'){ UI.toast('file-saver库未加载','error'); return; }
    const recs = Store.getAll();
    if (!recs.length){ UI.toast('错题本为空','warn'); return; }
    let list = recs;
    if (listFilter.mod) list = list.filter(r=>r.module===listFilter.mod);
    const kw = listFilter.kw.trim().toLowerCase();
    if (kw) list = list.filter(r=>(r.text||"").toLowerCase().includes(kw) || (r.note||"").toLowerCase().includes(kw) || (r.analysis||"").toLowerCase().includes(kw));
    if (!list.length){ UI.toast('当前筛选条件下没有错题','warn'); return; }

    const btn = $("#export-word");
    const btnText = btn ? btn.textContent : '';
    if (btn){ btn.disabled = true; btn.textContent = '正在生成…'; }

    try {
      const { Document, Packer, Paragraph, TextRun, HeadingLevel, AlignmentType, PageSize, convertMillimetersToTwip } = docx;
      const FONT = '宋体';
      const children = [];

      // 标题
      children.push(new Paragraph({
        alignment: AlignmentType.CENTER,
        spacing: { after: 240 },
        children: [new TextRun({ text: '行 测 错 题 本', bold: true, size: 56, font: FONT })]
      }));
      children.push(new Paragraph({
        alignment: AlignmentType.CENTER,
        spacing: { after: 360 },
        children: [
          new TextRun({ text: `导出时间：${new Date().toLocaleString('zh-CN')}`, size: 20, color: '666666', font: FONT }),
          new TextRun({ text: '    共 ' + list.length + ' 道错题', size: 20, color: '333333', font: FONT })
        ]
      }));
      children.push(new Paragraph({ children: [] }));

      // 模块统计
      const byModule = {};
      list.forEach(r=>{ byModule[r.module] = (byModule[r.module]||0)+1; });
      children.push(new Paragraph({
        spacing: { after: 80 },
        children: [new TextRun({ text: '模块统计：', bold: true, size: 22, font: FONT })]
      }));
      const statLines = Object.entries(byModule).map(([mid,c])=> UI.moduleName(mid) + ' ' + c + '题').join('  ·  ');
      children.push(new Paragraph({
        spacing: { after: 400 },
        children: [new TextRun({ text: statLines, size: 22, font: FONT })]
      }));

      // 每道题
      list.forEach((r, i)=>{
        const headLabel = (i+1) + '. [' + UI.moduleName(r.module) + ']' + (UI.subtypeName(r.module, r.subtype) ? ' · ' + UI.subtypeName(r.module, r.subtype) : '');
        children.push(new Paragraph({
          heading: HeadingLevel.HEADING_2,
          spacing: { before: 280, after: 160 },
          children: [new TextRun({ text: headLabel, bold: true, size: 26, font: FONT })]
        }));

        if (r.text){
          children.push(new Paragraph({ spacing:{ after:40 }, children:[new TextRun({ text:'【题目】', bold:true, size:22, font:FONT })] }));
          r.text.split(/\r?\n/).forEach(line=>{
            children.push(new Paragraph({ indent:{ firstLine: 440 }, spacing:{ after:40 }, children:[new TextRun({ text:line||'　', size:22, font:FONT })] }));
          });
        }

        const ans = [];
        if (r.myAnswer) ans.push(new TextRun({ text:'❌ 我的答案：' + r.myAnswer + '    ', color:'cf1322', size:22, font:FONT }));
        if (r.correctAnswer) ans.push(new TextRun({ text:'✅ 正确答案：' + r.correctAnswer, color:'389e0d', size:22, bold:true, font:FONT }));
        if (ans.length) children.push(new Paragraph({ spacing:{ before:120, after:60 }, children:ans }));

        if (r.note){
          children.push(new Paragraph({ spacing:{ before:100, after:40 }, children:[new TextRun({ text:'【我的错误原因】', bold:true, size:22, color:'d48806', font:FONT })] }));
          r.note.split(/\r?\n/).forEach(line=>{
            children.push(new Paragraph({ indent:{ firstLine:440 }, spacing:{ after:40 }, children:[new TextRun({ text:line||'　', size:22, font:FONT })] }));
          });
        }
        if (r.analysis){
          children.push(new Paragraph({ spacing:{ before:100, after:40 }, children:[new TextRun({ text:'【AI 深度解析】', bold:true, size:22, color:'1d39c4', font:FONT })] }));
          r.analysis.split(/\r?\n/).forEach(line=>{
            children.push(new Paragraph({ indent:{ firstLine:440 }, spacing:{ after:40 }, children:[new TextRun({ text:line||'　', size:22, font:FONT })] }));
          });
        }

        children.push(new Paragraph({ spacing:{ after:200 }, children:[] }));
      });

      const doc = new Document({
        styles: { default: { document: { run: { font: FONT, size: 22 } } } },
        sections: [{
          properties: {
            page: {
              size: { width: PageSize.A4.width, height: PageSize.A4.height },
              margin: {
                top: convertMillimetersToTwip(25.4),
                right: convertMillimetersToTwip(25.4),
                bottom: convertMillimetersToTwip(25.4),
                left: convertMillimetersToTwip(25.4)
              }
            }
          },
          children
        }]
      });

      Packer.toBlob(doc).then(blob=>{
        const fname = '行测错题本_' + new Date().toISOString().slice(0,10) + '.docx';
        saveAs(blob, fname);
        UI.toast('✅ Word 导出成功，开始下载', 'success', 2500);
      }).catch(e=>{ console.error(e); UI.toast('导出失败：'+(e.message||e), 'error'); });
    } catch(e){
      console.error(e);
      UI.toast('导出异常：'+(e.message||e), 'error');
    } finally {
      if (btn){ btn.disabled = false; btn.textContent = btnText; }
    }
  }

  // ============================================================
  //  全局事件委托 + 路由
  // ============================================================
  document.addEventListener("click", e=>{
    const link = e.target.closest("[data-link]");
    if (link){ e.preventDefault(); location.hash = link.dataset.link; }
    if (e.target.matches('[data-act="save"]')) saveRecord();
    if (e.target.matches('[data-act="copy-for-ai"]')) copyForAI();
    if (e.target.matches('[data-act="remove-img"]')){ addState.image=null; renderImgPreview(); }
  });

  window.addEventListener("hashchange", render);

  return { render };
})();

document.addEventListener("DOMContentLoaded", ()=>{ App.render(); });
</script>
</body>
</html>
